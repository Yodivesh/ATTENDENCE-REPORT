<html>
<body>
<h2>Admin Panel</h2>
<input id="n" placeholder="Name">
<input id="r" placeholder="Roll No">
<button onclick="mark()">Present</button>
<p id="msg"></p>
<script>
function mark(){
let n=document.getElementById("n").value;
let r=document.getElementById("r").value;
localStorage.setItem(r,n+" Present");
document.getElementById("msg").innerHTML="Marked";
}
</script>
</body>
</html>
